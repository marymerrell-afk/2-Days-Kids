  <style>
    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #12372a;
      --green-2: #1d5c45;
      --green-3: #2d7b5b;
      --cream: #f8f5ed;
      --cream-2: #fffdf8;
      --gold: #e5a93d;
      --orange: #ed7c35;
      --text: #193128;
      --muted: #65766e;
      --border: #dfe6df;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(18, 55, 42, 0.10);
      --radius: 22px;
      --max: 1180px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background: var(--cream-2);
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .container {
      width: min(100% - 40px, var(--max));
      margin-inline: auto;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .topbar {
      background: var(--green);
      color: white;
      font-size: 13px;
    }

    .topbar-inner {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .topbar strong {
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 253, 248, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(223, 230, 223, 0.8);
    }

    .nav {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--green);
    }

    .logo-mark {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--green);
      font-size: 17px;
      box-shadow: 0 8px 20px rgba(18, 55, 42, 0.18);
    }

    .logo-text {
      font-size: 19px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 700;
      color: #3e5048;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--green-3);
    }

    .nav-donate {
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--green);
      color: white !important;
    }

    .menu-btn {
      display: none;
      border: 0;
      background: transparent;
      font-size: 26px;
      cursor: pointer;
      color: var(--green);
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 90% 10%, rgba(229, 169, 61, 0.22), transparent 28%),
        radial-gradient(circle at 10% 80%, rgba(45, 123, 91, 0.13), transparent 30%),
        var(--cream);
      padding: 100px 0 110px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border-radius: 999px;
      background: #e7efe9;
      color: var(--green-2);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
    }

    h1 {
      font-size: clamp(48px, 7vw, 82px);
      line-height: 0.98;
      letter-spacing: -0.065em;
      color: var(--green);
      margin-bottom: 27px;
    }

    .hero h1 span {
      color: var(--orange);
    }

    .hero-copy {
      max-width: 650px;
      font-size: 18px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--green);
      color: white;
      box-shadow: 0 12px 25px rgba(18, 55, 42, 0.18);
    }

    .btn-secondary {
      background: white;
      color: var(--green);
      border-color: var(--border);
    }

    .hero-art {
      min-height: 500px;
      border-radius: 40px;
      background:
        linear-gradient(135deg, rgba(18,55,42,.95), rgba(45,123,91,.87)),
        url("https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=1200&q=80")
        center/cover;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .hero-art::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 20%,
        rgba(18,55,42,.65) 100%
      );
    }

    .hero-card {
      position: absolute;
      z-index: 2;
      bottom: 28px;
      left: 28px;
      right: 28px;
      padding: 23px;
      border-radius: 22px;
      background: rgba(255,255,255,.93);
      backdrop-filter: blur(12px);
    }

    .hero-card strong {
      display: block;
      font-size: 20px;
      color: var(--green);
      margin-bottom: 5px;
    }

    .hero-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================================================
       TRUST BAR
       ========================================================= */

    .trust {
      padding: 25px 0;
      background: var(--green);
      color: white;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      text-align: center;
    }

    .trust-item {
      padding: 8px 20px;
      border-right: 1px solid rgba(255,255,255,.15);
    }

    .trust-item:last-child {
      border-right: 0;
    }

    .trust-label {
      font-size: 11px;
      opacity: .65;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 800;
    }

    .trust-value {
      margin-top: 3px;
      font-size: 15px;
      font-weight: 800;
    }

       GENERAL SECTIONS
       ========================================================= */

    section {
      padding: 100px 0;
    }

    .section-header {
      max-width: 720px;
      margin-bottom: 50px;
    }

    .section-header.center {
      text-align: center;
      margin-inline: auto;
    }

    .section-kicker {
      color: var(--orange);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h2 {
      font-size: clamp(35px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.055em;
      color: var(--green);
      margin-bottom: 17px;
    }

    .section-header p {
      color: var(--muted);
      font-size: 17px;
    }

       MISSION
       ========================================================= */

    .mission {
      background: white;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .mission-image {
      min-height: 510px;
      border-radius: 35px;
      background:
        url("https://images.unsplash.com/photo-1542810634-71277d95dcbb?auto=format&fit=crop&w=1000&q=80")
        center/cover;
      box-shadow: var(--shadow);
    }

    .mission-content p {
      color: var(--muted);
      margin-bottom: 22px;
    }

    .check-list {
      display: grid;
      gap: 14px;
      margin: 30px 0;
      list-style: none;
    }

    .check-list li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-weight: 700;
    }

    .check {
      flex: 0 0 25px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e7efe9;
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
    }

    /* =========================================================
       PROGRAMS
       ========================================================= */

    .programs {
      background: var(--cream);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      padding: 32px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 30px rgba(18,55,42,.04);
    }

    .icon {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: #e7efe9;
      color: var(--green);
      font-size: 23px;
      margin-bottom: 22px;
    }

    .card h3 {
      font-size: 21px;
      color: var(--green);
      margin-bottom: 10px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
    }

    .placeholder-note {
      margin-top: 35px;
      padding: 18px 20px;
      border: 1px dashed #c7d2ca;
      border-radius: 15px;
      color: var(--muted);
      background: rgba(255,255,255,.55);
      font-size: 13px;
    }

    /* =========================================================
       IMPACT
       ========================================================= */

    .impact {
      background: var(--green);
      color: white;
    }

    .impact h2 {
      color: white;
    }

    .impact .section-header p {
      color: rgba(255,255,255,.7);
    }

    .impact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .impact-card {
      padding: 30px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      border-radius: 22px;
    }

    .impact-card .number {
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .impact-card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .impact-card p {
      color: rgba(255,255,255,.68);
      font-size: 14px;
    }

    /* =========================================================
       GET INVOLVED
       ========================================================= */

    .involved-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .involved-card {
      min-height: 290px;
      border-radius: 27px;
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      position: relative;
      background: var(--green);
      color: white;
    }

    .involved-card:nth-child(2) {
      background:
        linear-gradient(135deg, rgba(237,124,53,.9), rgba(229,169,61,.8)),
        url("https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=1000&q=80")
        center/cover;
    }

    .involved-card h3 {
      font-size: 28px;
      margin-bottom: 7px;
      position: relative;
      z-index: 2;
    }

    .involved-card p {
      color: rgba(255,255,255,.78);
      max-width: 500px;
      position: relative;
      z-index: 2;
    }

    .involved-card .btn {
      margin-top: 20px;
      align-self: flex-start;
      background: white;
      color: var(--green);
      position: relative;
      z-index: 2;
    }

    /* =========================================================
       DONATE
       ========================================================= */

    .donate {
      background: #f1eadb;
    }

    .donate-box {
      background: white;
      border-radius: 32px;
      padding: 60px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 60px;
      align-items: center;
    }

    .donate-box p {
      color: var(--muted);
      margin-bottom: 25px;
    }

    .donation-options {
      display: grid;
      gap: 12px;
    }

    .donation-option {
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .donation-option strong {
      color: var(--green);
    }

    .donation-option span {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================================================
       TRANSPARENCY
       ========================================================= */

    .transparency {
      background: white;
    }

    .transparency-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .info-panel {
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px;
    }

    .info-panel h3 {
      color: var(--green);
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 0;
      border-bottom: 1px solid #edf0ed;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-row span:first-child {
      color: var(--muted);
    }

    .info-row strong {
